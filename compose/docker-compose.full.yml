name: search-options-demo

services:
  postgres:
    image: artifactory.dev.nou-systems.com/nsi-containers-docker/library/postgres:15
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: search_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d search_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: artifactory.dev.nou-systems.com/nsi-containers-docker/getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev_meili_master_key
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  typesense:
    image: artifactory.dev.nou-systems.com/nsi-containers-docker/typesense/typesense:27.1
    command: ["--data-dir", "/data", "--api-key", "dev_typesense_api_key", "--enable-cors"]
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data

  app:
    image: artifactory.dev.nou-systems.com/nsi-containers-docker/library/node:22-alpine
    working_dir: /workspace
    command: ["npm", "run", "api:dev"]
    environment:
      PORT: "5173"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://demo:demo@postgres:5432/search_demo
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: dev_meili_master_key
      TYPESENSE_HOST: http://typesense:8108
      TYPESENSE_API_KEY: dev_typesense_api_key
    ports:
      - "5173:5173"
    volumes:
      - ..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      typesense:
        condition: service_started

volumes:
  typesense-data:
