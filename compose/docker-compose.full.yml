name: search-options-demo

services:
  postgres:
    build:
      context: ..
      dockerfile: compose/Dockerfile.postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: search_demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d search_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: dev_meili_master_key
      HF_HOME: /models/huggingface
      RAYON_NUM_THREADS: "1"
      MEILI_MAX_INDEXING_THREADS: "1"
      MEILI_MAX_INDEXING_MEMORY: 256MiB
    volumes:
      - ../data/native-models:/models:ro
      - meili-data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  typesense:
    image: typesense/typesense:28.0
    command: ["--data-dir", "/data", "--api-key", "dev_typesense_api_key", "--enable-cors", "--thread-pool-size", "2", "--num-collections-parallel-load", "1", "--num-documents-parallel-load", "1"]
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
      - ../data/native-models/typesense/models:/data/models:ro

  app:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run api:dev"]
    environment:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      PORT: "5173"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://demo:demo@postgres:5432/search_demo
      SEARCH_SYNC_PROVIDERS: meilisearch,typesense
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: dev_meili_master_key
      TYPESENSE_HOST: http://typesense:8108
      TYPESENSE_API_KEY: dev_typesense_api_key
    ports:
      - "5173:5173"
    volumes:
      - ..:/workspace
      - app-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      typesense:
        condition: service_started

volumes:
  postgres-data:
  meili-data:
  typesense-data:
  app-node-modules:
