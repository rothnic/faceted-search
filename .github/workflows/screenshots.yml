name: Internal UI mechanics (fixture mode)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Explicit internal fixture tests; real comparison screenshots live in native-embeddings.yml.
      - run: npm run verify:embeddings
      - run: npx playwright install --with-deps chromium
      - name: Local browser regressions (real services excluded)
        run: npx playwright test --workers=1 --grep-invert @real-services
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: map-readiness-diagnostics
          path: test-results/map-readiness*
          if-no-files-found: ignore
