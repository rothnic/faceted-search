name: Screenshots

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Exercise real inference and warm the pinned model cache before browser capture.
      - run: npm run verify:embeddings
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots:update
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
